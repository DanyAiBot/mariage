<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Deux alliances entrelacées">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6e3ad"/>
      <stop offset="28%"  stop-color="#d9ab52"/>
      <stop offset="55%"  stop-color="#b0863f"/>
      <stop offset="78%"  stop-color="#8a6626"/>
      <stop offset="100%" stop-color="#e7cd8f"/>
    </linearGradient>
    <linearGradient id="or2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff2cd"/>
      <stop offset="35%"  stop-color="#e0b761"/>
      <stop offset="70%"  stop-color="#a97f36"/>
      <stop offset="100%" stop-color="#f0dca6"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff8e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6b4d16" flood-opacity=".28"/>
    </filter>
  </defs>

  <ellipse cx="230" cy="140" rx="185" ry="105" fill="url(#lueur)"/>

  <g filter="url(#ombre)" fill="none" stroke-linecap="round">
    <!-- anneau de gauche (dessiné en entier) -->
    <circle cx="176" cy="130" r="76" stroke="url(#or)" stroke-width="13"/>
    <!-- anneau de droite (passe au-dessus) -->
    <circle cx="284" cy="130" r="76" stroke="url(#or2)" stroke-width="13"/>
    <!-- petit arc de l'anneau gauche redessiné par-dessus : effet entrelacé -->
    <path d="M 214 78 A 76 76 0 0 1 252 118" stroke="url(#or)" stroke-width="13.5"/>
  </g>

  <!-- reflets -->
  <g fill="none" stroke="#fffaf0" stroke-linecap="round" opacity=".5">
    <path d="M 118 92 A 76 76 0 0 1 152 66" stroke-width="4"/>
    <path d="M 226 92 A 76 76 0 0 1 260 66" stroke-width="4"/>
  </g>

  <!-- éclats -->
  <g fill="#e9c976">
    <path d="M 231 34 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z"/>
    <path d="M 340 66 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 z" opacity=".8"/>
    <path d="M 122 44 l 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 z" opacity=".7"/>
  </g>
</svg>
